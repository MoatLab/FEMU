# DRAM write buffer in front of the NAND.
#
# The buffer holds pages until they are pushed past the watermark, so repeated
# writes to the same page cost one program rather than several. vwc advertises a
# volatile write cache, which is what makes Flush drain the buffer and FUA
# skip it; without it the buffer still works but the host has no way to ask.

[device]
mode     = bbssd
devsz_mb = 4096
vwc      = 1
oncs     = 12          # DSM + Write Zeroes

[buffer]
buffer_size        = 2048    # pages
buffer_thres_pcent = 90      # start writing back at 90% full

[geometry]
secsz       = 512
secs_per_pg = 8
pgs_per_blk = 256
blks_per_pl = 256
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8
