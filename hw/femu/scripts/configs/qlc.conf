# QLC NAND with per-page-type timing.
#
# nand_cell_type turns on the page-type model, so pages within a wordline cost
# different amounts to read and program instead of sharing one flat figure.
# cell_pages is the bits-per-cell count and should match the cell type.

[device]
mode     = bbssd
devsz_mb = 4096

[nand]
nand_cell_type = 4      # 1 SLC, 2 MLC, 3 TLC, 4 QLC
cell_pages     = 4
pgtype_lat     = 1

[geometry]
secsz       = 512
secs_per_pg = 8
pgs_per_blk = 256
blks_per_pl = 256
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8
