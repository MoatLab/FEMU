# Sized by over-provisioning rather than by devsz_mb.
#
# op_pcent backs the device with the full NAND capacity and exposes a namespace
# that much smaller, so the spare area is a number you chose rather than the
# accident of devsz_mb not matching the geometry. Use this whenever the point of
# the run is garbage collection: without spare capacity there is nothing for GC
# to reclaim, and FEMU will refuse the configuration at startup.

[device]
mode     = bbssd
op_pcent = 10          # namespace = NAND / 1.10

[geometry]
secsz       = 512
secs_per_pg = 8
pgs_per_blk = 256
blks_per_pl = 64       # 4 GiB of NAND, so runs stay short
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8

[timing]
pg_rd_lat  = 40000
pg_wr_lat  = 200000
blk_er_lat = 2000000

[gc]
gc_thres_pcent      = 75
gc_thres_pcent_high = 95
