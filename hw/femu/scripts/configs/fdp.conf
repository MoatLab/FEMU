# Flexible Data Placement.
#
# The FDP properties live on the NVMe *subsystem*, not on the femu device --
# that is the step people usually miss when setting FDP up by hand. Putting them
# under [subsys] emits the second -device and wires the two together.

[device]
mode       = bbssd
devsz_mb   = 4096
namespaces = 1

[geometry]
secsz       = 512
secs_per_pg = 8
pgs_per_blk = 256
blks_per_pl = 256
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8

[subsys]
fdp      = on
fdp.nruh = 4        # reclaim unit handles
fdp.nrg  = 1        # reclaim groups
fdp.nru  = 256      # reclaim units
