# NoSSD with a controller front-end cost: no NAND model, but each Read and
# Write pays a host link transfer, a link delay and a firmware step.
#
# The figures follow the NVMeCHA FPGA controller with a null backend
# (Qiu et al., IEEE TCAD 2021): a 7000 MB/s link, 1.7 million 4 KiB IOPS and
# about 2.4 us per 4 KiB read. A 4 KiB transfer at 7000 MB/s takes 585 ns; with
# 1300 ns of link delay and 500 ns of firmware a read costs 2385 ns, and
# the link caps 4 KiB I/O near 1.7 million IOPS. Writes pay the same, so
# they come out below the controller's 3.2 us. What the guest measures
# also includes FEMU's own path.
#
# Delete the [frontend] keys for NoSSD with no added cost, the fastest
# device FEMU offers.

[device]
mode       = nossd
devsz_mb   = 4096
namespaces = 1

[frontend]
pcie_bandwidth_mbps = 7000
pcie_prop_delay_ns  = 1300
fw_cpu_ns           = 500
