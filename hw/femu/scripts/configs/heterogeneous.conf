# One controller, three namespaces, three different modes.
#
# namespace_modes is a list, so its commas are escaped for QEMU on the way out;
# write it here as plain commas.

[device]
mode            = bbssd        # the controller's own mode
devsz_mb        = 6144
namespaces      = 3
namespace_modes = bbssd,znssd,nossd

[geometry]
secsz       = 512
secs_per_pg = 8
pgs_per_blk = 256
blks_per_pl = 256
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8
