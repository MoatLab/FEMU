# Open-Channel SSD 2.0: the host runs the FTL and addresses the NAND by
# group, parallel unit, chunk and sector. Same device as run-whitebox.sh.
#
# Set lver = 1 for Open-Channel 1.2. Linux dropped LightNVM in 5.15, so a
# guest that drives either version needs an older kernel.

[device]
mode       = ocssd
lver       = 2
devsz_mb   = 4096
namespaces = 1

[geometry]
lnum_ch      = 2        # channels (groups)
lnum_lun     = 4        # LUNs per channel (parallel units)
lnum_pln     = 2
lpgs_per_blk = 512
lsecs_per_pg = 4
lsec_size    = 4096     # bytes
lmetasize    = 16       # out-of-band bytes per sector

[format]
nlbaf     = 5
lba_index = 3           # the 4 KiB LBA format
mdts      = 10
