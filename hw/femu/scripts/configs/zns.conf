# Zoned namespace.
#
# Zone size is not set directly -- it follows from the zone geometry:
#
#   pages_per_block = devsz / 16 KiB / (zns_num_ch * zns_num_lun * zns_num_blk)
#   zone_size = zns_chnls_per_zone * zns_num_lun * zns_num_plane
#               * pages_per_block * 16 KiB
#
# With the values below that is 256 MiB zones, 16 of them. Raise zns_num_blk for
# more, smaller zones.

[device]
mode       = znssd
devsz_mb   = 4096
namespaces = 1

[zones]
zns_num_ch    = 2
zns_num_lun   = 4
zns_num_plane = 2
zns_num_blk   = 32
zns_max_active = 32
zns_max_open   = 16

[timing]
# ZNS took its timing from built-in constants until these knobs existed; unset
# means the built-in figure for the configured cell type.
zns_pg_rd_lat  =
zns_pg_wr_lat  =
zns_blk_er_lat =
