# Computational storage: a BlackBox SSD that also runs programs next to the
# data. Same device as run-csd.sh.
#
# fdm_size is required. With csd_program_dir unset only the built-in program
# type loads; point it at a directory to load shared-library programs.

[device]
mode       = csd
devsz_mb   = 4096
namespaces = 1

[geometry]
secsz       = 512
secs_per_pg = 8         # 4 KiB pages
pgs_per_blk = 256
blks_per_pl = 256
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8

[timing]
pg_rd_lat  = 40000      # ns
pg_wr_lat  = 200000
blk_er_lat = 2000000

[gc]
gc_thres_pcent      = 75
gc_thres_pcent_high = 95

[compute]
fdm_size          = 64  # MiB of device memory for program data
nr_cu             = 4   # compute units
csf_runtime_scale = 3
csd_program_dir   =
