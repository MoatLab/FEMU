# A plain block-interface SSD: 4 GiB over 8 channels of 8 LUNs.
# This is the configuration most FEMU work starts from.

[device]
mode        = bbssd
devsz_mb    = 4096
namespaces  = 1

[geometry]
secsz        = 512
secs_per_pg  = 8      # 4 KiB pages
pgs_per_blk  = 256
blks_per_pl  = 256
pls_per_lun  = 1
luns_per_ch  = 8
nchs         = 8

[timing]
pg_rd_lat   = 40000     # ns
pg_wr_lat   = 200000
blk_er_lat  = 2000000
ch_xfer_lat = 0

[gc]
gc_thres_pcent      = 75
gc_thres_pcent_high = 95
