# Key-value SSD: Store, Retrieve, Delete, Exist and List on keys of up to
# 16 bytes. Same device as run-kvssd.sh.
#
# Values live on NAND laid out with the BlackBox geometry and pay its read
# and program times. The guest needs Linux 6.0 or newer and reaches the
# namespace through passthrough; there is no block device.

[device]
mode       = kvssd
devsz_mb   = 4096
namespaces = 1

[geometry]
secsz       = 512
secs_per_pg = 8
pgs_per_blk = 256
blks_per_pl = 256
pls_per_lun = 1
luns_per_ch = 8
nchs        = 8

[timing]
pg_rd_lat  = 40000      # ns
pg_wr_lat  = 200000
blk_er_lat = 2000000

[space]
gc_thres_pcent = 75     # share of the NAND usable for values
